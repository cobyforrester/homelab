apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vitagraphs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:cobyforrester/homelab.git
    targetRevision: HEAD
    path: k8s/apps/vitagraphs
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vitagraphs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
