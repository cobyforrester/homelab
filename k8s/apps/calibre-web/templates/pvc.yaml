apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-config
  labels:
    app: calibre
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: "{{ .Values.storage.storageClassName }}"
  resources:
    requests:
      storage: "{{ .Values.storage.configSize }}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-books
  labels:
    app: calibre
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: "{{ .Values.storage.storageClassName }}"
  resources:
    requests:
      storage: "{{ .Values.storage.booksSize }}"
