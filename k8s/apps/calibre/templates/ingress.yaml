apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calibre
  labels:
    app: calibre
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - calibre.home.arpa
      secretName: home-arpa-tls
  rules:
    - host: calibre.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calibre
                port:
                  number: 8083
