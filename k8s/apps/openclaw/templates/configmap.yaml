apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: {{ .Release.Namespace }}
data:
  openclaw.json: |
    {
      "gateway": {
        "bind": "lan",
        "mode": "remote",
        "controlUi": {
          "dangerouslyAllowHostHeaderOriginFallback": true
        },
        "auth": {
          "mode": "token"
        }
      }
    }
