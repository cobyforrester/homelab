apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openclaw
  labels:
    app: openclaw
spec:
  replicas: 1
  serviceName: openclaw-headless
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
      initContainers:
        - name: config-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - envsubst '${TELEGRAM_BOT_TOKEN} ${TELEGRAM_ALLOW_FROM}' < /templates/openclaw.json.tmpl > /config/openclaw.json
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-token
                  key: value
            - name: TELEGRAM_ALLOW_FROM
              valueFrom:
                secretKeyRef:
                  name: telegram-allow-from
                  key: value
          volumeMounts:
            - name: config-template
              mountPath: /templates
            - name: config-rendered
              mountPath: /config
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789", "--allow-unconfigured"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 18789
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-token
                  key: value
            - name: OPENCLAW_GATEWAY_MODE
              value: "remote"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-token
                  key: value
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18789
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 18789
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: config-rendered
              mountPath: /home/node/.openclaw/openclaw.json
              subPath: openclaw.json
      volumes:
        - name: config-template
          configMap:
            name: openclaw-config-template
        - name: config-rendered
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 10Gi
