apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
spec:
  blocks:
    {{- range .Values.loadBalancer.cidrs }}
    - cidr: "{{ . }}"
    {{- end }}
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan
spec:
  loadBalancerIPs: true
  interfaces:
    - eth0
  serviceSelector: {}
  nodeSelector: {}
